<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Log Viewer</title>
<script src="/vendor/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0f1420;
  --panel: #171e2e;
  --panel2: #1e2740;
  --border: #2a3550;
  --text: #dce3f0;
  --muted: #8494b5;
  --accent: #4f8cff;
  --green: #3ddc84;
  --red: #ff5c5c;
  --yellow: #f5c542;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; font-size: 13px;
}
#app { display: flex; flex-direction: column; height: 100vh; }
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.toolbar .brand { font-weight: 700; font-size: 15px; margin-right: 10px; color: var(--accent); }
.toolbar select, .toolbar input, .toolbar button {
  background: var(--panel2); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 12px;
}
.toolbar select:focus, .toolbar input:focus { outline: 1px solid var(--accent); }
.toolbar button { cursor: pointer; }
.toolbar button:hover { border-color: var(--accent); }
.toolbar .sep { width: 1px; height: 22px; background: var(--border); }
.toolbar .time-btn { padding: 4px 10px; }
.toolbar .time-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.toolbar .badge { font-size: 12px; color: var(--muted); }
.toolbar .badge.error { color: var(--red); }
.toolbar .badge.ok { color: var(--green); }
.toolbar input[type=datetime-local] { width: 165px; }
#search { width: 200px; }
.main { flex: 1; display: flex; min-height: 0; }
.charts {
  width: 380px; min-width: 300px; border-right: 1px solid var(--border);
  padding: 10px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
}
.chart-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
.chart-card h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.chart-card .canvas-wrap { height: 160px; }
.chart-card .canvas-wrap.tall { height: 190px; }
.logs { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.logs-head {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
}
.logs-head .info { color: var(--muted); }
.table-wrap { flex: 1; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  position: sticky; top: 0; background: var(--panel2); color: var(--muted);
  text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); font-weight: 600; white-space: nowrap;
}
tbody td { padding: 6px 10px; border-bottom: 1px solid #1c2540; vertical-align: top; }
tbody tr:hover { background: #1a2336; }
td.ts { white-space: nowrap; color: var(--muted); }
td.mod { white-space: nowrap; }
td.svc { white-space: nowrap; color: var(--yellow); max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
td.content { cursor: pointer; word-break: break-all; }
tr.detail-row td { background: #121a2b; color: var(--muted); font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
.logs-foot {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--border);
}
.logs-foot .pager { display: flex; gap: 6px; align-items: center; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.loading { opacity: .55; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <div class="toolbar" id="toolbar">
    <span class="brand">Lucky Log</span>
    <select id="instSelect" title="实例"></select>
    <span class="sep"></span>
    <select id="moduleSelect" title="模块">
      <option value="">全部模块</option>
    </select>
    <select id="serviceSelect" title="服务" disabled>
      <option value="">全部服务</option>
    </select>
    <span class="sep"></span>
    <select id="dedupSelect" title="去重">
      <option value="time_content">去重: 时间+内容</option>
      <option value="content">去重: 内容</option>
      <option value="off">去重: 关闭</option>
    </select>
    <span class="sep"></span>
    <button class="time-btn active" data-range="1h">近1h</button>
    <button class="time-btn" data-range="6h">近6h</button>
    <button class="time-btn" data-range="24h">近24h</button>
    <button class="time-btn" data-range="7d">近7d</button>
    <button class="time-btn" data-range="custom">自定义</button>
    <input type="datetime-local" id="fromInput" title="起始">
    <input type="datetime-local" id="toInput" title="结束">
    <button id="timeApply" title="应用时间">应用</button>
    <span class="sep"></span>
    <input type="text" id="search" placeholder="关键词搜索…">
    <span class="sep"></span>
    <button id="realtimeToggle">实时: 关</button>
    <button id="refreshBtn">手动刷新</button>
    <span class="sep"></span>
    <button id="exportCsv">导出 CSV</button>
    <button id="exportJson">导出 JSON</button>
    <span id="statusBadge" class="badge"></span>
  </div>
  <div class="main">
    <div class="charts">
      <div class="chart-card"><h3>模块分布</h3><div class="canvas-wrap"><canvas id="chartModule"></canvas></div></div>
      <div class="chart-card"><h3>时间趋势</h3><div class="canvas-wrap tall"><canvas id="chartTimeline"></canvas></div></div>
      <div class="chart-card"><h3>服务分布</h3><div class="canvas-wrap"><canvas id="chartService"></canvas></div></div>
    </div>
    <div class="logs">
      <div class="logs-head">
        <div class="info" id="logInfo"></div>
        <div class="info" id="instInfo"></div>
      </div>
      <div class="table-wrap" id="tableWrap">
        <table id="logTable">
          <thead>
            <tr><th>时间</th><th>模块</th><th>服务</th><th>内容</th></tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
      <div class="logs-foot">
        <div class="pager">
          <button id="prevPage">‹</button>
          <span id="pageInfo"></span>
          <button id="nextPage">›</button>
        </div>
        <span id="dedupInfo" class="tag"></span>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

const PALETTE = ["#4f8cff", "#3ddc84", "#f5c542", "#ff7a7a", "#b06cff", "#42c6c6",
  "#ff9d3c", "#e061cb", "#7be382", "#5ab2ff", "#ffd166", "#c77bff"];

const state = {
  instances: [],
  instance: "",
  module: "",
  service: "",
  dedup: "time_content",
  timeRange: "1h",
  from: null,
  to: null,
  search: "",
  page: 1,
  pageSize: 200,
  total: 0,
  realtime: false,
  ws: null,
  moduleNames: [],
  serviceTree: [],
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));

const nowEpoch = () => Math.floor(Date.now() / 1000);

function applyTimeRange() {
  const now = nowEpoch();
  const ranges = { "1h": 3600, "6h": 6 * 3600, "24h": 24 * 3600, "7d": 7 * 86400 };
  if (state.timeRange === "custom") {
    state.from = toEpoch($("fromInput").value) ?? null;
    state.to = toEpoch($("toInput").value) ?? null;
  } else {
    state.from = now - ranges[state.timeRange];
    state.to = now;
  }
  state.page = 1;
}

function toEpoch(v) {
  if (!v) return null;
  return Math.floor(new Date(v).getTime() / 1000);
}

function fmtEpoch(ts) {
  if (!ts) return "-";
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

async function api(path) {
  const resp = await fetch(path);
  if (!resp.ok) throw new Error(`${path} → HTTP ${resp.status}`);
  return resp.json();
}

function queryParams() {
  const p = new URLSearchParams();
  if (state.instance) p.set("instance", state.instance);
  if (state.module) p.set("module", state.module);
  if (state.service) p.set("service", state.service);
  if (state.from != null) p.set("from_epoch", state.from);
  if (state.to != null) p.set("to_epoch", state.to);
  if (state.search) p.set("search", state.search);
  return p;
}

async function init() {
  bindEvents();
  applyTimeRange();
  const data = await api("/api/instances");
  state.instances = data.instances.filter((i) => i.enabled);
  if (!state.instances.length) {
    $("logInfo").textContent = "没有启用的实例，请检查 config.json";
    return;
  }
  const sel = $("instSelect");
  sel.innerHTML = state.instances.map((i) => `<option value="${esc(i.name)}">${esc(i.name)} (${esc(i.host)})</option>`).join("");
  state.instance = state.instances[0].name;
  await loadMeta();
  await Promise.all([loadLogs(true), loadStats()]);
  renderInstInfo();
}

function bindEvents() {
  $("instSelect").addEventListener("change", async (e) => {
    state.instance = e.target.value;
    state.page = 1;
    await loadMeta();
    await Promise.all([loadLogs(true), loadStats()]);
    renderInstInfo();
  });
  $("moduleSelect").addEventListener("change", (e) => {
    state.module = e.target.value;
    state.page = 1;
    const svc = $("serviceSelect");
    svc.value = "";
    state.service = "";
    svc.disabled = !(!state.module || state.module === "webservice");
    loadLogs(true); loadStats();
  });
  $("serviceSelect").addEventListener("change", (e) => {
    state.service = e.target.value;
    state.page = 1;
    loadLogs(true);
  });
  $("dedupSelect").addEventListener("change", (e) => {
    state.dedup = e.target.value;
    state.page = 1;
    loadLogs(true);
  });
  $("search").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { state.search = e.target.value.trim(); state.page = 1; loadLogs(true); }
  });
  document.querySelectorAll(".time-btn").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".time-btn").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    state.timeRange = b.dataset.range;
    applyTimeRange();
    loadLogs(true); loadStats();
  }));
  $("timeApply").addEventListener("click", () => {
    state.timeRange = "custom";
    document.querySelectorAll(".time-btn").forEach((x) => x.classList.remove("active"));
    document.querySelector('.time-btn[data-range="custom"]').classList.add("active");
    applyTimeRange();
    loadLogs(true); loadStats();
  });
  $("refreshBtn").addEventListener("click", () => { loadLogs(true); loadStats(); });
  $("realtimeToggle").addEventListener("click", toggleRealtime);
  $("prevPage").addEventListener("click", () => { if (state.page > 1) { state.page--; loadLogs(false); } });
  $("nextPage").addEventListener("click", () => {
    if (state.page * state.pageSize < state.total) { state.page++; loadLogs(false); }
  });
  $("exportCsv").addEventListener("click", () => exportLogs("csv"));
  $("exportJson").addEventListener("click", () => exportLogs("json"));
}

async function loadMeta() {
  const [modData, svcData] = await Promise.all([
    api(`/api/modules?instance=${encodeURIComponent(state.instance)}`),
    api(`/api/services?instance=${encodeURIComponent(state.instance)}`),
  ]);
  state.moduleNames = Object.keys(modData.modules || {});
  const mSel = $("moduleSelect");
  const current = state.module;
  mSel.innerHTML = `<option value="">全部模块</option>` + state.moduleNames
    .map((m) => `<option value="${esc(m)}">${esc(m)} (${modData.modules[m]})</option>`).join("");
  if (current && state.moduleNames.includes(current)) mSel.value = current;

  state.serviceTree = svcData.tree || [];
  const svcSel = $("serviceSelect");
  const svcCurrent = state.service;
  const opts = [`<option value="">全部服务</option>`];
  for (const rule of state.serviceTree) {
    opts.push(`<option value="${esc(rule.Key)}">${esc(rule.Name || rule.Key)}</option>`);
    for (const sub of rule.SubRuleList || []) {
      opts.push(`<option value="${esc(sub.Key)}">↳ ${esc(rule.Name || rule.Key)} / ${esc(sub.Name || sub.Key)}</option>`);
    }
  }
  svcSel.innerHTML = opts.join("");
  if (svcCurrent) svcSel.value = svcCurrent;
  svcSel.disabled = !(!state.module || state.module === "webservice");
}

function renderInstInfo() {
  const inst = state.instances.find((i) => i.name === state.instance);
  if (!inst) return;
  const parts = [];
  if (inst.last_collect) parts.push(`最近采集 ${fmtEpoch(inst.last_collect)}`);
  parts.push(`库内 ${inst.total} 条`);
  if (inst.last_error) {
    $("instInfo").innerHTML = parts.map(esc).join(" · ") +
      ` <span style="color:var(--red)">· 最近错误: ${esc(inst.last_error)}</span>`;
  } else {
    $("instInfo").textContent = parts.join(" · ");
  }
}

async function loadLogs(reset) {
  if (reset) state.page = 1;
  const params = queryParams();
  params.set("page", state.page);
  params.set("page_size", state.pageSize);
  params.set("dedup", state.dedup);
  const body = $("logBody");
  const wrap = $("tableWrap");
  wrap.classList.add("loading");
  try {
    const data = await api(`/api/logs?${params.toString()}`);
    state.total = data.total;
    renderRows(reset, data.items);
    renderPageInfo();
    const dk = state.dedup === "off" ? "去重: 关" : (state.dedup === "content" ? "去重: 内容" : "去重: 时间+内容");
    $("dedupInfo").textContent = `${dk} · 第 ${data.page} 页 / ${data.page_size} 条每页`;
    $("logInfo").textContent = `共 ${data.total} 条日志`;
  } catch (err) {
    $("logInfo").textContent = `加载失败: ${err.message}`;
  } finally {
    wrap.classList.remove("loading");
  }
}

function renderRows(reset, items, prepend) {
  const body = $("logBody");
  if (reset) body.innerHTML = "";
  if (!items.length && reset) {
    body.innerHTML = `<tr><td colspan="4"><div class="empty">暂无日志</div></td></tr>`;
    return;
  }
  const frag = document.createDocumentFragment();
  items.forEach((row) => {
    const tr = document.createElement("tr");
    tr.dataset.id = row.id;
    tr.innerHTML = `
      <td class="ts">${esc(row.ts_text)}</td>
      <td class="mod"><span class="tag">${esc(row.module)}</span></td>
      <td class="svc" title="${esc(row.rule_name || row.sub_name || "")}">${esc(row.rule_name || row.sub_name || "—")}</td>
      <td class="content">${esc(row.content)}</td>`;
    const raw = row.raw ? JSON.stringify(row.raw, null, 2) : "";
    tr.querySelector("td.content").addEventListener("click", () => toggleDetail(tr, raw));
    frag.appendChild(tr);
  });
  if (prepend) body.prepend(frag);
  else body.appendChild(frag);
}

function toggleDetail(tr, raw) {
  const existing = tr.nextElementSibling;
  if (existing && existing.classList.contains("detail-row")) {
    existing.remove();
    return;
  }
  if (!raw) return;
  const detail = document.createElement("tr");
  detail.className = "detail-row";
  detail.innerHTML = `<td colspan="4">${esc(raw)}</td>`;
  tr.after(detail);
}

function renderPageInfo() {
  const totalPages = Math.max(1, Math.ceil(state.total / state.pageSize));
  $("pageInfo").textContent = `第 ${state.page} / ${totalPages} 页`;
  $("prevPage").disabled = state.page <= 1;
  $("nextPage").disabled = state.page >= totalPages;
}

// ---------- 图表 ----------

const charts = {};
let chartInstances = { module: null, timeline: null, service: null };

function chartCtx(id) {
  const el = $(id);
  const key = { chartModule: "module", chartTimeline: "timeline", chartService: "service" }[id];
  if (chartInstances[key]) { chartInstances[key].destroy(); chartInstances[key] = null; }
  return el.getContext("2d");
}

function renderCharts(data) {
  const moduleCtx = chartCtx("chartModule");
  const moduleRows = (data.by_module || []).slice(0, 10);
  chartInstances.module = new Chart(moduleCtx, {
    type: "doughnut",
    data: {
      labels: moduleRows.map((m) => m.module),
      datasets: [{ data: moduleRows.map((m) => m.count), backgroundColor: PALETTE }],
    },
    options: { plugins: { legend: { position: "right", labels: { color: "#8494b5", boxWidth: 10 } } }, maintainAspectRatio: false },
  });

  const tCtx = chartCtx("chartTimeline");
  const granularity = state.timeRange === "7d" || (state.from && state.to && (state.to - state.from) > 3 * 86400) ? "day" : "hour";
  const bucketStep = granularity === "day" ? 86400 : 3600;
  chartInstances.timeline = new Chart(tCtx, {
    type: "line",
    data: {
      labels: (data.timeline || []).map((b) => {
        const d = new Date(b.bucket * 1000);
        return granularity === "day"
          ? `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`
          : `${String(d.getHours()).padStart(2, "0")}:00`;
      }),
      datasets: [{ label: "日志数", data: (data.timeline || []).map((b) => b.count), borderColor: "#4f8cff", backgroundColor: "rgba(79,140,255,.15)", fill: true, tension: .3, pointRadius: 1 }],
    },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: "#8494b5", maxTicksLimit: 12, maxRotation: 0 } }, y: { ticks: { color: "#8494b5" } } }, maintainAspectRatio: false },
  });

  const sCtx = chartCtx("chartService");
  const svcRows = (data.by_service || []).slice(0, 10);
  chartInstances.service = new Chart(sCtx, {
    type: "bar",
    data: {
      labels: svcRows.map((s) => s.rule_name || s.rule_key || "(全部)"),
      datasets: [{ label: "条数", data: svcRows.map((s) => s.count), backgroundColor: PALETTE }],
    },
    options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: "#8494b5", maxRotation: 45 } }, y: { ticks: { color: "#8494b5" } } }, maintainAspectRatio: false },
  });
}

async function loadStats() {
  const params = queryParams();
  params.set("granularity", state.timeRange === "7d" ? "day" : "hour");
  try {
    const data = await api(`/api/stats?${params.toString()}`);
    renderCharts(data);
  } catch (err) {
    console.error("stats 加载失败", err);
  }
}

// ---------- 导出 ----------

function exportLogs(format) {
  const params = queryParams();
  params.set("dedup", state.dedup);
  params.set("format", format);
  window.location.href = `/api/export?${params.toString()}`;
}

// ---------- 实时模式 ----------

function toggleRealtime() {
  state.realtime = !state.realtime;
  $("realtimeToggle").textContent = `实时: ${state.realtime ? "开" : "关"}`;
  $("realtimeToggle").style.borderColor = state.realtime ? "var(--green)" : "";
  if (state.realtime) openWS();
  else if (state.ws) state.ws.close();
}

function openWS() {
  if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/stream`);
  state.ws = ws;
  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      if (msg.type === "logs" && Array.isArray(msg.items)) {
        const incoming = msg.items.filter((r) => !state.instance || r.instance === state.instance);
        if (incoming.length) {
          renderRows(false, incoming, true);
          loadStats();
        }
      }
    } catch (e) { /* ignore */ }
  };
  ws.onclose = () => {
    if (state.realtime) setTimeout(openWS, 2000);
  };
}

init().catch((err) => {
  $("logInfo").textContent = `初始化失败: ${err.message}`;
  console.error(err);
});
</script>
</body>
</html>
